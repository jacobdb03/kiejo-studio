<!doctype html>
<html>
    <head>
        <include src="dev-partialFiles/header.html"></include>

    <body>
        <include src="dev-partialFiles/navbar.html"></include>

        <div id="smooth-wrapper">
            <div id="smooth-content">
                <section
                    class="relative flex flex-col h-screen w-full justify-end overflow-hidden bg-kBlack"

                    <div
                        class="relative z-20 pb-20 flex flex-col w-full max-w-480 mx-auto px-2 md:px-5 lg:px-20"
                    >
                        <div class="flex flex-row gap-6 flex-wrap">
                            <h2
                                class="text-kWhite text-sm md:text-lg font-light"
                            >
                                February 2025
                            </h2>
                            <h2
                                class="text-kWhite text-sm md:text-lg font-light"
                            >
                                Concept Project
                            </h2>
                        </div>
                        <h1
                            class="text-5xl md:text-9xl font-black text-kWhite mt-4"
                        >
                            Coder x NCFC.
                        </h1>
                        <h3
                            class="font-semibold text-lg leading-relaxed text-kWhite mt-4"
                        >
                            An experimental motion project brief set by Coder in
                            Norwich, showing off Coder's brand at the screens in
                            Norwich City Football Club's grounds through a
                            classic football icon: the wave.
                        </h3>
                        <div
                            class="flex flex-row gap-4 mt-4 flex-wrap text-xs md:text-sm font-bold"
                        >
                            <include
                                src="dev-partialFiles/pageTag.html"
                                locals='{"tagName": "Motion Design"}'
                            ></include>
                        </div>
                    </div>
                </section>

                <section
                    class="flex flex-col max-w-480 mx-auto mt-16 px-2 md:px-5 lg:px-20"
                >
                    <div class="relative w-full aspect-video cus-blurContainer">
                        <canvas class="absolute w-full h-full"></canvas>
                        <video
                            class="absolute w-full h-full object-cover"
                            muted
                            autoplay
                            loop
                            preload="auto"
                            playsinline
                        >
                            <source
                                src="assets/AnimatedBigScreen.mp4"
                                type="video/mp4"
                            />
                            Coder Promo animation
                        </video>
                    </div>
                </section>

                <section
                    class="flex flex-col max-w-480 mx-auto mt-16 px-2 md:px-5 lg:px-20"
                >
                    <h2>More work to come soon!</h2>
                </section>

                <include src="dev-partialFiles/footer.html"></include>
            </div>
        </div>
    </body>
