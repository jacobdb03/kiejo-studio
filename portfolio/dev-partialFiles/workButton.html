<a
    class="flex w-full h-auto overflow-hidden {{size}} transform duration-500 ease-out rounded-xl lg:rounded-4xl cus-link"
    href="{{href}}"
>
    <img
        class="w-full h-auto {{cusAspect}} object-cover overflow-clip {{cusPos}} transform-view duration-300 ease-out hover:scale-105"
        src="../dev-thumbnailFiles/{{src}}"
        alt="{{text}} Thumbnail Image"
    />
</a>
