<a
    class="flex w-full h-auto overflow-hidden {{size}} transform duration-500 ease-out rounded-4xl"
    href="{{href}}"
>
    <img
        class="w-full h-auto aspect-4/3 object-cover overflow-clip {{cusPos}} transform-view duration-300 ease-out hover:scale-105"
        src="{{src}}"
        alt="{{text}} Thumbnail Image"
    />
</a>
