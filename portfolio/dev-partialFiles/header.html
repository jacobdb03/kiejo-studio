<script>
    (function () {
        document.documentElement.classList.add("js-preload", "js-enabled");

        // SELF-TIMEOUT: Remove preload after 0.1s EVEN IF JS fails
        setTimeout(() => {
            document.documentElement.classList.remove("js-preload");
        }, 100);
    })();
</script>
<style>
    /* Global animation killer + overlay - Tailwind compatible */
    .js-preload *,
    .js-preload *::before,
    .js-preload *::after {
        transition: none !important;
        animation: none !important;
        transform: none !important;
    }
    .js-preload::before {
        content: "";
        position: fixed;
        inset: 0;
        background: var(--color-kWhite);
        z-index: 99999;
        opacity: 1;
    }
    /* Remove overlay when ready */
    :not(.js-preload)::before {
        content: none;
    }
</style>
